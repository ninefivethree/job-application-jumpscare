<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>j*b application jumpscare</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:wght@600&display=swap"
        rel="stylesheet">

    <style>
        html {
            background-color: #f4f4f5;
            color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: start;

            font-family: "Inter", sans-serif;
            padding: 0 2rem;

            * {
                box-sizing: border-box;
            }
        }

        a {
            text-decoration-color: transparent;
            text-decoration-thickness: 0.125rrem;
            color: #000;
            transition: text-decoration-color 0.1s;
        }

        a:hover {
            text-decoration-color: inherit;
            transition: text-decoration-color 0.1s;
        }

        a,
        p {
            letter-spacing: -0.03rrem;
            font-size: 0.9rem;
            font-weight: 500;
        }

        body {
            width: 100%;
            max-width: 60rem;
            padding: 0 0 2rem;
            margin: 0;
        }

        main {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: start;
            flex-direction: column;
            gap: 1rem;
            margin-top: 0.5rem;
        }

        .navbar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.25rem 0;

            * {
                margin-top: 0;
                margin-bottom: 0;
            }
        }

        .nav-links {
            display: flex;
            gap: 3rem;
        }

        .logotype {
            font-family: "Poppins", sans-serif;
            font-size: 1.75rem;
        }

        .cta-button {
            text-decoration: none;
            background-color: #000;
            color: #fff;
            font-weight: 400;

            padding: 0.6rem 1.25rem;
            border-radius: 0.75rem;
        }

        .bg-accent {
            background-color: #0077ff;
        }

        .card {
            border-radius: 1rem;
            border: 1px solid #e4e4e7;
            box-shadow: 0px 4px 6px 0px #0000000D;
            background-color: #fafafa;
        }

        #hero-banner {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-direction: column;

            padding: 1rem 2rem;
            gap: 1rem;

            background: url("https://ninefivethree.github.io/fake-landing/shapes.jpg");
            background-size: cover;
            background-position: center;
        }

        #hero-heading {
            text-align: center;
            font-weight: 600;
        }

        .offers-container {
            width: 100%;
            display: flex;
            align-items: start;
            justify-content: space-between;
            gap: 1rem;
        }

        #filters-card {
            display: flex;
            align-items: start;
            justify-content: start;
            flex-direction: column;
            gap: 1.25rem;
            padding: 1rem;
            width: calc(100% / 3);
            min-width: 20rem;

            fieldset {
                display: flex;
                border: none;
                padding: 0;
                width: 100%;
                align-items: start;
                justify-content: start;
                flex-direction: column;

                legend {
                    margin: 0;
                    margin-bottom: 0.5rem;
                    font-weight: 500;
                    font-size: 0.9rem;
                }
            }
        }

        input {
            border: 1px solid #e4e4e7;
            background-color: #f4f4f5;
            border-radius: 0.5rem;
            padding: 0.5rem;
            font-size: 0.75rem;
            width: 100%;
        }

        .button-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;

            button {
                width: fit-content;
                border: none;
                background-color: #f4f4f5;
                color: #a1a1aa;
                font-weight: 300;
                padding: 0.25rem 0.4rem;
                border-radius: 0.25rem;
            }
        }

        .offer-list {
            display: flex;
            flex-wrap: wrap;
            width: 100%;
            gap: 1rem;
        }

        .offer-card {
            min-width: 12rem;
            padding: 1.5rem;
        }

        #location-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            background-color: #f4f4f5;
            padding: 0.75rem 0.5rem;
            border-radius: 0.5rem;
            gap: 0.25rem;
        }

        label {
            font-size: 0.8em;
            font-weight: 400;
            width: 100%;
        }

        input[type="checkbox"] {
            height: 1.1rem;
            width: 1.1rem;
            background-color: #e4e4e7;
        }

        .location-item {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #salary-container {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5em;
        }

        .spacer {
            padding: 0.75em 0.5px;
            background-color: #e4e4e7;
        }

        footer {
            margin-top: 1em;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <h1 class="logotype">
            mattee
        </h1>
        <section class="nav-links">
            <a href="/">Vacancies</a>
            <a href="/">For employers</a>
        </section>
        <a href="/" class="cta-button bg-accent">Publish</a>
    </nav>
    <main>
        <div class="card" id="hero-banner">
            <span></span>
            <h1 id="hero-heading">
                Exclusive offers available
                <br>
                through our Telegram channel
            </h1>
            <a href="/" class="cta-button">
                Subscribe now
            </a>
        </div>
        <div class="offers-container">
            <form class="card" id="filters-card">
                <input type="text" placeholder="Search" id="search-input">
                <fieldset>
                    <legend>
                        Work hours
                    </legend>
                    <div class="button-list">
                        <button>
                            Part-time
                        </button>
                        <button>
                            Full-time
                        </button>
                        <button>
                            Internship
                        </button>
                    </div>
                </fieldset>
                <fieldset>
                    <legend>
                        Model
                    </legend>
                    <div class="button-list">
                        <button>
                            Onsite
                        </button>
                        <button>
                            Remote
                        </button>
                        <button>
                            Hybrid
                        </button>
                    </div>
                </fieldset>
                <fieldset>
                    <legend>
                        Grade
                    </legend>
                    <div class="button-list">
                        <button>
                            Junior
                        </button>
                        <button>
                            Middle
                        </button>
                        <button>
                            Senior
                        </button>
                        <button>
                            Lead
                        </button>
                        <button>
                            Head
                        </button>
                    </div>
                </fieldset>
                <fieldset>
                    <legend>
                        Location
                    </legend>
                    <div id="location-container">
                        <div class="location-item">
                            <label for="stockholm">
                                Stockholm
                            </label>
                            <input type="checkbox" id="stockholm" name="stockholm" />
                        </div>
                        <div class="location-item">
                            <label for="gothenburg">
                                Gothenburg
                            </label>
                            <input type="checkbox" id="gothenburg" name="gothenburg" />
                        </div>
                        <div class="location-item">
                            <label for="malmo">
                                Malmö
                            </label>
                            <input type="checkbox" id="malmo" name="malmo" />
                        </div>
                        <div class="location-item">
                            <label for="uppsala">
                                Uppsala
                            </label>
                            <input type="checkbox" id="uppsala" name="uppsala" />
                        </div>
                    </div>
                </fieldset>
                <fieldset>
                    <legend>
                        Salary
                    </legend>
                    <div id="salary-container">
                        <input type="text" placeholder="Starting at" id="salary-min" />
                        <span class="spacer"></span>
                        <input type="text" placeholder="Up to" id="salary-max" />
                    </div>
                </fieldset>
            </form>
            <div class="offer-list">
                <div class="card offer-card">
                </div>
                <div class="card offer-card">
                </div>
                <div class="card offer-card">
                </div>
                <div class="card offer-card">
                </div>
            </div>
        </div>
    </main>
    <footer>
        <div class="card" id="hero-banner">
        </div>
    </footer>
</body>

</html>
